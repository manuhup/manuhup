<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="452" viewBox="0 0 1280 452" role="img" aria-label="Manuel Hupperich, AI engineer in Berlin. 2 of 2 checks on my public projects passed on 9 Nov 2026." xmlns:c2pa="http://c2pa.org/manifest">
